<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Camera</title>
    <style>
      :root {
        --bg: #09090b;
        --surface: #141417;
        --border: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #3b82f6;
        --accent-pressed: #2563eb;
        --user: #1e293b;
        --assistant: #14532d;
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: calc(8px + var(--safe-t)) 12px calc(8px + var(--safe-b));
        gap: 8px;
        overflow: hidden;
      }
      .preview {
        flex: 0 0 auto;
        width: 100%;
        aspect-ratio: 16 / 10;
        max-height: min(36dvh, 280px);
        background: #000;
        border-radius: 14px;
        border: 1px solid var(--border);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .preview .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 12px;
        text-align: center;
      }
      .toolbar {
        display: flex;
        gap: 8px;
      }
      button {
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-primary {
        flex: 1;
        padding: 14px 16px;
        background: var(--accent);
        color: #fff;
      }
      .btn-ghost {
        padding: 14px 16px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .status {
        min-height: 16px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .status.error { color: #f87171; }
      .messages {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg {
        max-width: 92%;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--assistant);
      }
      .msg .label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .composer {
        display: flex;
        gap: 8px;
      }
      .composer input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 16px;
      }
      .composer input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .btn-ask {
        padding: 12px 18px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="preview" id="preview">
        <span class="empty" id="empty">Aim the camera, then capture.</span>
        <img id="frame" alt="Camera" hidden />
      </div>

      <div class="toolbar">
        <button type="button" class="btn-primary" id="snapBtn">Capture</button>
        <button type="button" class="btn-ghost" id="resetBtn">Clear</button>
      </div>

      <div class="status" id="status"></div>
      <div class="messages" id="messages"></div>

      <form class="composer" id="askForm">
        <input id="question" type="text" placeholder="Ask about the screen…" autocomplete="off" />
        <button type="submit" class="btn-ask" id="askBtn">Ask</button>
      </form>
    </div>

    <script>
      const previewEl = document.getElementById("preview");
      const emptyEl = document.getElementById("empty");
      const frameEl = document.getElementById("frame");
      const messagesEl = document.getElementById("messages");
      const snapBtn = document.getElementById("snapBtn");
      const resetBtn = document.getElementById("resetBtn");
      const askBtn = document.getElementById("askBtn");
      const askForm = document.getElementById("askForm");
      const questionEl = document.getElementById("question");
      const statusEl = document.getElementById("status");

      const AUTO_PROMPT = "What's the answer?";
      let hasSnapshot = false;
      let frameUrl = null;
      let pollTimer = null;

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg || "";
        statusEl.classList.toggle("error", !!isError);
      }

      function showBlob(blob) {
        if (frameUrl) URL.revokeObjectURL(frameUrl);
        frameUrl = URL.createObjectURL(blob);
        frameEl.src = frameUrl;
        frameEl.hidden = false;
        emptyEl.hidden = true;
      }

      function appendMessage(role, content) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "Answer";
        const body = document.createElement("span");
        body.textContent = content;
        div.appendChild(label);
        div.appendChild(body);
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function fetchSnapshot() {
        const resp = await fetch("/snapshot?t=" + Date.now(), { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.blob();
      }

      async function pollFrame() {
        if (hasSnapshot) return;
        try {
          showBlob(await fetchSnapshot());
        } catch (err) {
          setStatus("Camera error: " + err.message, true);
        }
      }

      function startPolling() {
        stopPolling();
        pollFrame();
        pollTimer = setInterval(pollFrame, 1000);
      }

      async function loadSnapshot() {
        stopPolling();
        const blob = await fetchSnapshot();
        showBlob(blob);
        hasSnapshot = true;
      }

      async function takePicture() {
        snapBtn.disabled = true;
        askBtn.disabled = true;
        setStatus("Capturing…");
        try {
          await loadSnapshot();
          setStatus("Analyzing…");
          await ask(AUTO_PROMPT, { fromAutoCapture: true });
          setStatus("");
        } catch (err) {
          setStatus(err.message, true);
          hasSnapshot = false;
          startPolling();
        } finally {
          snapBtn.disabled = false;
          askBtn.disabled = false;
        }
      }

      async function ask(question, opts = {}) {
        askBtn.disabled = true;
        questionEl.disabled = true;
        setStatus(hasSnapshot ? "Thinking…" : "Capturing…");
        try {
          if (!hasSnapshot) await loadSnapshot();
          const resp = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          if (!resp.ok) {
            const detail = await resp.json().catch(() => ({}));
            throw new Error(detail.detail || "HTTP " + resp.status);
          }
          const data = await resp.json();
          appendMessage("user", question);
          appendMessage("assistant", data.answer);
          setStatus("");
          if (!opts.fromAutoCapture) questionEl.value = "";
        } catch (err) {
          setStatus(err.message, true);
        } finally {
          askBtn.disabled = false;
          questionEl.disabled = false;
          if (!opts.fromAutoCapture) questionEl.focus();
        }
      }

      async function clearSession() {
        stopPolling();
        if (frameUrl) URL.revokeObjectURL(frameUrl);
        frameUrl = null;
        messagesEl.innerHTML = "";
        frameEl.removeAttribute("src");
        frameEl.hidden = true;
        emptyEl.hidden = false;
        hasSnapshot = false;
        setStatus("Cleared.");
        await fetch("/reset", { method: "POST" });
        startPolling();
      }

      snapBtn.addEventListener("click", takePicture);
      resetBtn.addEventListener("click", clearSession);
      askForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = questionEl.value.trim();
        if (!q) return;
        ask(q);
      });

      startPolling();
    </script>
  </body>
</html>
